<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>preTypeset harness</title>
<style>
  body{margin:0;font-family:sans-serif;background:#f8f9fa}
  .fake-doc{margin:20px auto;width:640px;min-height:900px;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:60px;line-height:1.6}
  #result{position:fixed;left:8px;bottom:8px;font:11px monospace;background:#fff;padding:4px;max-width:600px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="fake-doc"><h2>(가짜 Docs 편집기 영역)</h2><p>왼쪽은 Docs, 오른쪽은 preTypeset 패널.</p></div>
<pre id="result">running…</pre>
<script>
  // chrome.* 대체
  const mem = {};
  window.chrome = {
    storage: { local: {
      get(keys, cb) { const ks = Array.isArray(keys) ? keys : [keys]; const o = {}; for (const k of ks) if (k in mem) o[k] = JSON.parse(JSON.stringify(mem[k])); setTimeout(() => cb(o)); },
      set(obj, cb) { Object.assign(mem, JSON.parse(JSON.stringify(obj))); setTimeout(() => cb && cb()); },
      remove(keys, cb) { for (const k of [].concat(keys)) delete mem[k]; setTimeout(() => cb && cb()); }
    } },
    runtime: { onMessage: { addListener() {} } }
  };
</script>
<script src="../lib/zip.js"></script>
<script src="../lib/idml.js"></script>
<script src="../lib/docs-source.js"></script>
<script>
  PTDocs.docIdFromLocation = () => 'test-doc';
  PTDocs.fetchDocsHtml = async () => {
    const src = new URLSearchParams(location.search).get('src') || 'sample-docs.html';
    let t = await (await fetch('fixtures/' + src)).text();
    const rep = parseInt(new URLSearchParams(location.search).get('big') || '0', 10);
    if (rep) { const m = t.match(/(<h1[\s\S]*?)(<div><p class="c16">)/); t = t.replace(m[1], m[1].repeat(rep)); }
    return t;
  };
</script>
<script src="../lib/style-css.js"></script>
<script src="../lib/defaults.js"></script>
<script src="../lib/layout.js"></script>
<script src="../lib/markup.js"></script>
<script src="../lib/fonts.js"></script>
<script src="../content/main.js"></script>
<script>
  const params = new URLSearchParams(location.search);
  const waitIdle = async () => {
    const t0 = Date.now();
    await new Promise(r => setTimeout(r, 300));
    while (PTApp.state.laying && Date.now() - t0 < 120000) await new Promise(r => setTimeout(r, 100));
  };
  (async () => {
    const out = {};
    try {
      await PTApp.toggle(true);
      await waitIdle();
      out.emptyState = !!shadowRoot().querySelector('.pt-empty') && PTApp.state.pages.length === 0 && !PTApp.state.tpl;
      if (params.get('tpl') === 'builtin') {
        await PTApp._loadTemplate(PTDefaults.BUILTIN.id);
        await PTApp.refresh(true);
        await waitIdle();
      }
      out.builtinPages = PTApp.state.pages.length;
      if (params.get('tpl') === 'builtin') {
        const S = PTApp.state;
        out.blocks = (S.blocks || []).map(b => b.kind + ':' + (b.comp || b.key) + (b.container ? '@' + b.container : '')).join(' ');
        out.folios = S.pages.slice(0, 30).map(p => p.number + ' ' + p.side + ' [' + Array.from(p.el.querySelectorAll('.pt-mframe')).map(f => f.textContent.trim()).join(' / ') + ']');
      }
      out.builtinMs = Math.round(performance.now());
      if (params.get('tpl') !== 'builtin') {
        if (params.get('start')) PTApp.state.opts.startPage = parseInt(params.get('start'), 10);
        const buf = await (await fetch('fixtures/' + (params.get('idml') || 'sample.idml'))).arrayBuffer();
        if (params.get('fonts')) {
          const listing = await (await fetch('fixtures/private/fonts/')).text();
          const names = Array.from(listing.matchAll(/href="([^"]+\.(?:otf|ttf|OTF|TTF))"/g)).map(m => m[1]);
          const files = [];
          for (const n of names) files.push(new File([await (await fetch('fixtures/private/fonts/' + n)).arrayBuffer()], decodeURIComponent(n)));
          out.fontFiles = files.length;
          await PTApp.importFonts(files);
          await waitIdle();
        }
        const t1 = performance.now();
        await PTApp.importFile(new File([buf], 'sample.idml'));
        await waitIdle();
        out.idmlLayoutMs = Math.round(performance.now() - t1);
        const S = PTApp.state;
        out.template = { name: S.tpl.name, page: S.tpl.page, margins: S.tpl.margins, styles: S.tpl.styles.map(s => s.label + ' ' + s.size + '/' + s.leading), master: S.tpl.master && { left: S.tpl.master.left.length, right: S.tpl.master.right.length }, variables: S.tpl.variables };
        out.mapping = S.mapping;
        out.pages = S.pages.length;
        out.overset = S.pages.filter(p => p.overset).map(p => p.number);
        out.blocks = S.doc.blocks.map(b => b.kind + ':' + b.key).join(' ');
        out.folios = S.pages.slice(0, 30).map(p => p.number + ' ' + p.side + ' [' + Array.from(p.el.querySelectorAll('.pt-mframe')).map(f => f.textContent.trim()).join(' / ') + ']');
        out.fonts = S.fonts;
        out.sections = S.pages.flatMap(p => Array.from(p.el.querySelectorAll('[data-key="sectionNum"], [data-key="practice"]')).filter(e => !e.classList.contains('pt-cont')).map(e => p.number + ':' + e.textContent.slice(0, 24)));
        out.usedKeys = S.usedKeys;
        // 특정 쪽의 틀/장식 내용: probe=쪽번호
        if (params.get('probe')) {
          const pg = S.pages.find(p => String(p.number) === params.get('probe'));
          if (pg) out.probe = Array.from(pg.el.querySelectorAll('.pt-tframe, .pt-tpl>.pt-mframe, .pt-master>.pt-mframe, .pt-deco')).map(e => e.className + ' @' + e.style.left + ',' + e.style.top + ' ' + e.textContent.trim().slice(0, 50));
        }
      }
      if (params.get('drawer') === '0' && shadowRoot().querySelector('.pt-drawer.pt-show')) shadowRoot().querySelector('.pt-btn[title^="스타일 매핑"]').click();
      if (params.get('grid')) { PTApp.state.opts.grid = true; await PTApp.relayout(); }
      if (params.get('spread') === '0') { PTApp.state.opts.spread = false; shadowRoot().querySelector('.pt-btn[title*="펼침면"]').click(); shadowRoot().querySelector('.pt-btn[title*="펼침면"]').click(); }
      if (params.get('zoom')) PTApp.setZoom(parseFloat(params.get('zoom')));
      await new Promise(r => setTimeout(r, 200));
      if (params.get('page')) { const w = shadowRoot().querySelector('.pt-wrap[data-n="' + params.get('page') + '"]'); const v = shadowRoot().querySelector('.pt-viewer'); v.scrollTop += w.getBoundingClientRect().top - v.getBoundingClientRect().top - 10; }
      if (params.get('synctest')) {
        // 가짜 Docs 모델: 원고 텍스트를 문단마다 줄바꿈으로 이어 붙인다
        const raw = await (await fetch('fixtures/' + (params.get('src') || 'sample-docs.html'))).text();
        const d = new DOMParser().parseFromString(raw, 'text/html');
        const model = Array.from(d.body.querySelectorAll('p,h1,h2,h3,h4,h5,h6,li,td')).map(e => e.textContent).join('\n');
        PTApp._setModel(model);
        const needle = params.get('synctest');
        const off = model.indexOf(needle);
        PTApp._onCursor(off);
        await new Promise(r => setTimeout(r, 1500));
        const cur = shadowRoot().querySelector('.pt-cursor');
        const wrap = cur && cur.closest('.pt-wrap');
        const v = shadowRoot().querySelector('.pt-viewer');
        const wr = wrap && wrap.getBoundingClientRect(), vr = v.getBoundingClientRect();
        out.sync = { offset: off, alignedBlocks: PTApp.sync.offsets && PTApp.sync.offsets.filter((x, i, a) => i === 0 || x !== a[i - 1]).length,
          cursorText: cur && cur.textContent.slice(0, 40), page: wrap && wrap.dataset.n, pageVisible: !!wr && wr.bottom > vr.top && wr.top < vr.bottom };
      }
    } catch (e) {
      out.error = String(e && e.stack || e);
    }
    document.getElementById('result').textContent = JSON.stringify(out, null, 1);
    document.title = 'DONE';
  })();
  function shadowRoot() { return document.getElementById('pretypeset-host').shadowRoot; }
</script>
</body>
</html>
